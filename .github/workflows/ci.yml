# CI gate — full Native-AOT publish + test suite on every PR (and pushes to main).
#
# WHY THIS EXISTS
#   IL2026 / IL3050 (trim + AOT) errors — and any other AOT-only break — are
#   ONLY surfaced by the trimmed *Publish* build. A plain Release build, or
#   `build.ps1 -Target UI` / `-Target Test`, does NOT run the trim analyzer, so
#   these slip through local dev and only fail at release time. That is exactly
#   how the str_params JsonArray.Add<T> break reached `main` (fixed in #413).
#
#   This job runs the SAME command the release workflow uses
#   (`build.ps1 -Mode Publish`), so a green check here == a green release build:
#   C++ DLL + Native-AOT Avalonia UI + the full C# / C++ test suite.
#
# TO MAKE IT BLOCK MERGES
#   A workflow file can't require itself. In GitHub → Settings → Branches → add a
#   branch protection rule for `main` → "Require status checks to pass" → select
#   "CI (AOT gate) / AOT publish + tests". (Or via gh — see the note in the PR.)
name: CI (AOT gate)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Cancel superseded runs for the same PR / ref so pushing several commits to an
# open PR in quick succession doesn't pile up ~10-min AOT builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aot-gate:
    name: AOT publish + tests
    # Same pinned image as release.yml: windows-latest / -2025 redirect to
    # -vs2026, which ships VS2026 + cmake + ninja (build.ps1 finds VS via
    # vswhere, so it stays toolchain-version-agnostic).
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout (submodules inited manually below)
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1          # gate needs no history (unlike the release changelog)

      - name: Init public build submodules
        shell: pwsh
        # Only the two PUBLIC vendor submodules are needed to build.
        run: git submodule update --init vendor/minhook vendor/zydis

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: AOB pattern regression (blocks)
        shell: pwsh
        # The ONLY automated check on Himmel.h's patterns. Everything else needs ~200 GB of Ghidra
        # projects that exist on one machine, so before this an edit to a pattern was unverifiable
        # in CI. Asserts each recorded site still RESOLVES to its recorded address — not merely
        # that some bytes still match, which would pass a broken displacement.
        # Pure stdlib, no Ghidra, no corpus, seconds. See docs/aob-block-library-eval.md §4.
        run: |
          # Resolve an interpreter explicitly. This runner uses a custom label, so do not assume
          # which of python/python3/py is on PATH — and report it, so a missing interpreter reads as
          # "no Python" instead of a cryptic failure in the next line.
          $py = @('python','python3','py') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $py) { throw 'no Python interpreter on PATH (tried python, python3, py)' }
          Write-Host "using $py -- $(& $py --version)"
          # --check asserts Himmel.h's own header counts against what was parsed, and fails on
          # unresolved/dead constants. Without it the script prints discrepancies and still exits
          # 0, so this step only ever caught a Python crash — which is how four docs drifted to
          # four different pattern counts while Himmel.h stayed right (build 2530).
          & $py tools/ghidra/extract_patterns.py dll/src/Himmel.h out/sweep/patterns.tsv --check
          if ($LASTEXITCODE -ne 0) { throw "extract_patterns.py --check FAILED ($LASTEXITCODE) - Himmel.h's header counts disagree with its tables, or a constant is dead/unresolved" }
          & $py tools/ghidra/blocktest.py
          if ($LASTEXITCODE -ne 0) { throw "blocktest FAILED ($LASTEXITCODE) - a pattern no longer resolves to its recorded address" }
          # The live-verification register had SIX competing spellings across 14 files and was
          # missing items roadmap.md had carried a caveat for since build 796. A doc convention
          # nobody enforces survives about one commit, so this one is enforced (build 2543).
          & $py tools/check_live_verification.py
          if ($LASTEXITCODE -ne 0) { throw "check_live_verification.py FAILED ($LASTEXITCODE) - a roadmap 'In-game verification pending' caveat is untagged or untracked in todo.md's register" }
          # The authoring gate from aob-block-library-eval.md's build order, step 5 - the step that
          # was specified, never built, and then declared complete. Stdlib-only, no corpus, seconds.
          # Golden-file: ANY specificity change must be a deliberate baseline update, because a
          # falling CLEAR count can mean a better index and a rising bound means a noisier pattern,
          # and only a human can tell those apart (see eval §7).
          & $py tools/pe/aob_specificity.py --tsv out/sweep/patterns.tsv --baseline tools/pe/aob-specificity-baseline.tsv --check
          if ($LASTEXITCODE -ne 0) { throw "aob_specificity --check FAILED ($LASTEXITCODE) - a pattern's noise profile changed, or a new pattern landed unrecorded. Read the diff before regenerating the baseline." }
          # The Ghidra-free sweep's port guard (build 2545). The full acceptance test is
          # byte-identical output vs a Ghidra run, which needs the 59 GB archive and cannot run
          # here; this covers the two places the port can silently diverge - the bytes.find
          # prefilter that replaced the Java's anchor-bucket sweep, and pe_memory.py's
          # max(SizeOfRawData, VirtualSize) section rule. Stdlib-only, ~1s, no corpus.
          & $py tools/ghidra/pe_scan_selftest.py
          if ($LASTEXITCODE -ne 0) { throw "pe_scan_selftest FAILED ($LASTEXITCODE) - pe_scan_patterns.py/pe_memory.py no longer match the behaviour scan_patterns.java specifies" }
          # UI string dictionary, both directions (audit #4 R6). DANGLING is the crash case -
          # a missing StaticResource raises at load time, taking down whichever panel uses it -
          # and ORPHAN is the honesty case: a dictionary full of unreachable keys misrepresents
          # what is actually localizable, which the translation pass then pays for. 24 orphans
          # had accumulated by the audit, two of them SHADOWED by hardcoded C# computing the
          # same text. Stdlib-only, no Avalonia, <1s.
          & $py tools/check_axaml_strings.py
          if ($LASTEXITCODE -ne 0) { throw "check_axaml_strings FAILED ($LASTEXITCODE) - an en.axaml key is referenced-but-undefined (a load-time crash) or defined-but-unreferenced (dead). Run 'py tools/check_axaml_strings.py --list' for both sets." }
          # CE Lua <-> DLL mailbox contract. Every generated script bakes a contract version
          # and checks itself against what the DLL publishes - but that is only worth anything
          # if the version actually moves when the contract does. A FORGOTTEN bump is worse
          # than no versioning: every old script then asserts it is compatible while writing to
          # offsets that moved, and the check meant to catch that says "fine". So the surface
          # (MailboxData fields + Cmd + every per-command op enum + Status/InitState) is hashed
          # against a golden value, and the C# mirror - the constant actually baked into the
          # scripts - must agree with the DLL. Stdlib-only, <1s.
          & $py tools/check_mailbox_contract.py
          if ($LASTEXITCODE -ne 0) { throw "check_mailbox_contract FAILED ($LASTEXITCODE) - the CE Lua mailbox contract changed without a version bump, or CeMailboxLayout.ContractVersion disagrees with Mimic::MAILBOX_CONTRACT. The failure message says which of the two numbers to move." }
          # Derived counts stated in prose. CLAUDE.md already carried the rule ("Docs numbers are
          # DERIVED - regenerate, never hand-edit") and the docs broke it anyway, the way a rule
          # with no check always breaks: right on the day it was typed, never re-derived. A
          # 2026-08-06 audit found the pipe-command count as ~87 in five places, 31 in a sixth and
          # ~30 in a seventh while Renge.h held 99. Each is harmless alone; together they make the
          # CORRECT numbers untrustworthy too, because a reader cannot tell which is which.
          # Claims are registered explicitly rather than regex-swept, so deltas and historical
          # snapshots ("+3 commands", "~48 total") are not false-flagged. Stdlib-only, <1s.
          & $py tools/check_derived_counts.py
          if ($LASTEXITCODE -ne 0) { throw "check_derived_counts FAILED ($LASTEXITCODE) - a doc states a count that disagrees with the tree, or a registered claim was reworded so the check silently stopped covering it. The failure prints the paste-able value per file." }
          # tools/ue-sample: the README IS the acceptance criteria for a test nothing can run
          # here - what it verifies is a live process being injected into and walked. So the one
          # thing CI CAN do is stop the doc and the code from drifting apart: the numbers a
          # tester types, the CJK literals B28 turns on, and the constant names that encode the
          # trigger itself (Even2_OneNull = 2 chars, exactly one with a 0x00 low byte). Audit
          # #4's 4a root cause - the report and the reality computed by different code paths.
          # Stdlib-only, no engine, <1s. Skips cleanly if the sample folder is absent.
          & $py tools/check_ue_sample_values.py
          if ($LASTEXITCODE -ne 0) { throw "check_ue_sample_values FAILED ($LASTEXITCODE) - tools/ue-sample/README.md and the DumperTest sources disagree. Run 'py tools/check_ue_sample_values.py --list'." }
          # The audit register's open/closed count is DERIVED from a per-row tick, and a fix
          # session has twice marked the grouped queue row (1 2 3) while leaving the individual
          # finding rows it covered unmarked - so the register kept reporting shipped work as
          # open. Eleven rows the first time (2026-08-15), eight more on 2026-08-17. Both times
          # the fix itself was fine and the dev-log was right; only the marker was missing, which
          # is why nothing noticed. Same family as check_derived_counts: a number in a doc that
          # nothing re-derives. Stdlib-only, <1s.
          & $py tools/check_audit_register.py
          if ($LASTEXITCODE -ne 0) { throw "check_audit_register FAILED ($LASTEXITCODE) - a finding docs/dev-log.md reports fixed has no tick on its row in the audit doc, so the open count over-reports. The failure names each one. Marking the grouped queue row is not enough." }
          # Proxy export surface. A proxy DLL is a NAME map and an ORDINAL map, and audit PX1
          # found both halves wrong on two of the four at once - silently, for months. A name
          # the real DLL exports and we do not kills the game before DllMain, with no log file
          # to say why. A stolen ordinal is worse because it "works": link.exe assigns UNPINNED
          # exports from (max pinned + 1) in name-sorted order, so with nothing pinned our UE5_*
          # block sat on GetdfDIJoystick (@6, dinput8) and on VerFindFileA..VerQueryValueW
          # (@10-17, version - the DEFAULT proxy), and an ordinal import called ours with a
          # wholly unrelated signature. Compared against a committed baseline rather than live
          # System32 on purpose: these tables vary by Windows build, and a runner whose System32
          # differs from the maintainer's must not redden an unrelated PR. Stdlib-only, <1s.
          & $py tools/check_proxy_exports.py
          if ($LASTEXITCODE -ne 0) { throw "check_proxy_exports FAILED ($LASTEXITCODE) - a dll/src/Proxy*.def omits a real export or fails to pin its real ordinal. The failure names each one. Remember a .def line exports nothing on its own; it needs an implementation in the matching Lugner_*.cpp/.asm." }

      - name: Build + test + AOT publish (the gate)
        shell: pwsh
        # -Mode Publish -Target All == C++ DLL + Native-AOT UI + full test suite.
        # -NoBumpBuildNumber: the runner's build_number.txt bump is throwaway.
        run: ./build.ps1 -Mode Publish -Clean -NoBumpBuildNumber

      - name: Proxy export surface, on the ARTIFACTS
        shell: pwsh
        # The step above checks the .def SOURCE; this one re-parses the export tables of the
        # four DLLs that were just linked. Both are needed, and audit PX1 is why: its own filed
        # severity was wrong because it was rated from the source, and the shipped binary turned
        # out to export 66 names where the .def listed 36 (/DEF: MERGES with __declspec(dllexport)
        # rather than suppressing it, contrary to what three .def headers claimed). The source
        # and the artifact are computed by different code paths - audit #4's 4a root cause - so
        # only the artifact settles what the loader will actually see.
        run: |
          $py = @('python','python3','py') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          & $py tools/check_proxy_exports.py --artifacts --list
          if ($LASTEXITCODE -ne 0) { throw "check_proxy_exports --artifacts FAILED ($LASTEXITCODE) - a BUILT proxy DLL does not export the real DLL's full surface at the real ordinals. This is what the game's loader sees." }
